<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記録の編集</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='日記.css')}}">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-submit {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }
        .btn-cancel {
            background: #475569;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            text-align: center;
            flex: 1;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Flashメッセージ表示エリア（カード内に配置） -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-messages" style="margin-bottom: 20px;">
              {% for category, message in messages %}
                <div class="flash-message {{ category }}">
                  {{ message }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <h2 style="margin-top: 0;">✏️ 記録の編集</h2>
        
        <!-- 更新用ルートにID付きで送信 -->
        <form action="/update/{{ log[0] }}" method="POST">
            <div class="form-group">
                <label for="date">日付</label>
                <input type="date" id="date" name="date" value="{{ log[1] }}" required>
            </div>

            <div class="form-group">
                <label for="condition">体調スコア (1〜5)</label>
                <input type="number" id="condition" name="condition" min="1" max="5" value="{{ log[2] }}" required>
            </div>

            <div class="form-group">
                <label for="rating">満足度 (1〜5)</label>
                <input type="number" id="rating" name="rating" min="1" max="5" value="{{ log[5] }}" required>
            </div>

            <div class="form-group">
                <label for="sleep_hours">睡眠時間 (時間)</label>
                <input type="number" id="sleep_hours" name="sleep_hours" step="0.5" value="{{ log[4] }}" required>
            </div>

            <div class="form-group">
                <label for="memo">メモ・日記</label>
                <textarea id="memo" name="memo" rows="3">{{ log[3] }}</textarea>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-submit">更新する</button>
                <a href="/" class="btn-cancel">キャンセル</a>
            </div>
        </form>
    </div>
</body>
</html>
