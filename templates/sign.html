<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規ユーザー登録 - Mood & Health Journal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='日記.css')}}">
</head>
<body style="font-family: sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;">

    <div style="background-color: #1e293b; padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
        
        <!-- Flashメッセージ表示エリア（カード内に配置） -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-messages" style="width: 100%; margin: 0 0 15px 0;">
              {% for category, message in messages %}
                <div class="flash-message {{ category }}">
                  {{ message }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <h2 style="margin-top: 0; text-align: center; color: #38bdf8;">新規ユーザー登録</h2>

        <form action="/signup" method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
                <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">ユーザー名</label>
                <input type="text" name="username" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: #fff; box-sizing: border-box;">
            </div>
            <div>
                <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">パスワード</label>
                <input type="password" name="password" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: #fff; box-sizing: border-box;">
            </div>
            <button type="submit" style="background-color: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 0.5rem;">登録する</button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #94a3b8;">
            すでにアカウントをお持ちの方は <a href="/login" style="color: #38bdf8;">ログインへ</a>
        </p>
    </div>
</body>
</html>
